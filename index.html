<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maharani Cafe | Jaipur</title>
  <meta name="description" content="Handcrafted pure vegetarian dining, stone-fired pizza, panini, and cafe delicacies inspired by the royal heritage of Jaipur." />
  <meta name="theme-color" content="#181514" />

  <!-- Google Fonts: Italiana (Bespoke Luxury Display Serif) + DM Sans (Clean Modern Proportions) + Rozha One (Heritage Devanagari) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Italiana&family=Rozha+One&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       MAHARANI CAFE — JAIPUR HERITAGE CULINARY DESIGN SYSTEM
       Bespoke Agency Craft • Zero AI Slop • Architectural Precision
       ========================================================================== */
    :root {
      --nav-height: 54px;

      --bg-canvas: #FAF7F2;
      --bg-card: #FFFFFF;
      --bg-sandstone: #F3ECE2;
      --bg-wash: #F6EDE8;

      /* Jaipur Pink City Terracotta Lime-Wash */
      --terracotta: #B35446;
      --terracotta-dark: #8F3A2E;
      --terracotta-soft: #F5EAE6;
      --terracotta-border: rgba(179, 84, 70, 0.22);
      --terracotta-glow: rgba(179, 84, 70, 0.12);

      /* Deep Charcoal Onyx */
      --charcoal-ink: #181514;
      --charcoal-surface: #221E1C;
      --charcoal-muted: #58504B;
      --charcoal-faint: #8E857F;
      --border-subtle: rgba(24, 21, 20, 0.08);
      --border-medium: rgba(24, 21, 20, 0.14);

      /* Antique Royal Brass */
      --antique-brass: #C29B62;
      --antique-brass-light: #DFC898;
      --antique-brass-dim: rgba(194, 155, 98, 0.35);

      /* Certified Vegetarian Emerald */
      --veg-green: #1E824C;
      --veg-soft: #EBF5EF;

      /* Typographic Hierarchy */
      --font-display: 'Italiana', serif;
      --font-body: 'DM Sans', -apple-system, sans-serif;
      --font-scripture: 'Rozha One', serif;

      /* Geometry & Easing */
      --radius-xs: 2px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 14px;
      --radius-pill: 9999px;

      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --shadow-subtle: 0 2px 10px rgba(24, 21, 20, 0.04);
      --shadow-elevation: 0 8px 24px rgba(24, 21, 20, 0.08);
      --shadow-float: 0 16px 48px rgba(24, 21, 20, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--charcoal-ink);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 110px;
    }

    /* Global tactile linen texture */
    .linen-watermark {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.028;
      background-image: 
        radial-gradient(circle at center, var(--charcoal-ink) 1px, transparent 1px),
        radial-gradient(circle at center, var(--terracotta) 1px, var(--bg-canvas) 1px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }

    .viewport-container {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg-canvas);
      border-left: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
    }

    /* ==========================================================================
       REDESIGNED CLEAN TOP NAVBAR (NO TABLE 04, SYMMETRICAL EDITORIAL LUXURY)
       ========================================================================== */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 80;
      height: var(--nav-height);
      background: rgba(250, 247, 242, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-left-seal {
      display: flex;
      align-items: center;
      width: 38px;
    }
    .nav-seal-svg {
      width: 26px;
      height: 26px;
      color: var(--charcoal-ink);
    }

    .app-brand-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
    }
    .app-brand-lockup h1 {
      font-family: var(--font-display);
      font-size: 17px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      line-height: 1.1;
      color: var(--charcoal-ink);
    }
    .app-brand-lockup span {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--terracotta);
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 38px;
    }

    .icon-action-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--charcoal-ink);
      cursor: pointer;
      transition: all 0.2s var(--ease-out-expo);
    }
    .icon-action-btn:hover {
      background: var(--bg-sandstone);
      border-color: var(--border-medium);
    }
    .icon-action-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Expandable Search Input */
    .search-panel {
      padding: 0 16px 12px 16px;
      background: rgba(250, 247, 242, 0.96);
      border-bottom: 1px solid var(--border-subtle);
      display: none;
      animation: slideDown 0.22s var(--ease-out-expo);
    }
    .search-panel.active {
      display: block;
    }
    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-input-wrap svg {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      color: var(--charcoal-faint);
    }
    .search-input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 13.5px;
      color: var(--charcoal-ink);
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--terracotta);
    }
    .search-clear-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--charcoal-faint);
      cursor: pointer;
      font-size: 14px;
    }

    /* ==========================================================================
       HERO BRAND SHOWCASE (PALACE ART + RAJASTHANI BENEDICTIONS, NO SLOP BOXES)
       ========================================================================== */
    .hero-showcase {
      padding: 22px 20px 14px 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(246, 237, 232, 0.5) 0%, rgba(250, 247, 242, 0) 100%);
      position: relative;
    }

    /* Jharokha Arch Silhouette Border around Logo */
    .jharokha-frame {
      position: relative;
      display: inline-block;
      max-width: 135px;
      margin: 0 auto 10px auto;
      padding: 6px;
    }
    .jharokha-frame img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(179, 84, 70, 0.08));
    }

    .rajasthan-royal-blessing {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 2px;
    }
    .blessing-text {
      font-family: var(--font-scripture);
      font-size: 15px;
      letter-spacing: 0.06em;
      color: var(--terracotta-dark);
    }
    .heritage-city-sub {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--antique-brass);
      margin-bottom: 12px;
    }

    /* Architectural Jaali Divider */
    .jaali-divider-band {
      width: 100%;
      height: 12px;
      margin: 12px 0 4px 0;
      opacity: 0.4;
      background-image: url("data:image/svg+xml,%3Csvg width='36' height='12' viewBox='0 0 36 12' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M18 0L9 6l9 6 9-6-9-6zm0 2.4L23.4 6 18 9.6 12.6 6 18 2.4zM0 6l9-6v12L0 6zm36 0l-9-6v12l9-6z' fill='%23B35446' fill-rule='evenodd'/%3E%3C/svg%3E");
      background-repeat: repeat-x;
    }

    /* ==========================================================================
       FLUSH STICKY CATEGORY NAV (ZERO CLIPPING / ZERO CUTOFF ON MOBILE)
       ========================================================================== */
    .sticky-cat-wrapper {
      position: sticky;
      top: var(--nav-height);
      z-index: 75;
      background: rgba(250, 247, 242, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 12px;
      box-shadow: 0 4px 14px rgba(24, 21, 20, 0.03);
    }

    .cat-nav-scroll {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      overflow-y: visible;
      padding: 4px 2px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }
    .cat-nav-scroll::-webkit-scrollbar {
      display: none;
    }

    /* All Categories Quick Jump Drawer Trigger Pill */
    .cat-nav-index-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6.5px 12px;
      background: var(--bg-sandstone);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-pill);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--charcoal-ink);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s var(--ease-out-expo);
    }
    .cat-nav-index-btn:hover {
      background: var(--terracotta-soft);
      border-color: var(--terracotta-border);
      color: var(--terracotta-dark);
    }
    .cat-nav-index-btn svg {
      width: 14px;
      height: 14px;
    }

    .cat-nav-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6.5px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 500;
      color: var(--charcoal-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s var(--ease-out-expo);
    }
    .cat-nav-pill svg {
      width: 14px;
      height: 14px;
      stroke: var(--charcoal-faint);
      transition: stroke 0.2s;
    }
    .cat-nav-pill.active {
      background: var(--charcoal-ink);
      border-color: var(--charcoal-ink);
      color: #FFFFFF;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(24, 21, 20, 0.16);
    }
    .cat-nav-pill.active svg {
      stroke: var(--antique-brass-light);
    }

    /* ==========================================================================
       MENU SECTIONS & DISH CARDS
       ========================================================================== */
    .menu-main-content {
      padding: 16px;
    }

    .category-section {
      margin-bottom: 30px;
      scroll-margin-top: 112px;
    }

    .cat-header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .cat-header-title {
      font-family: var(--font-display);
      font-size: 21px;
      letter-spacing: 0.05em;
      color: var(--charcoal-ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cat-header-count {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--terracotta);
    }

    /* Standard Card Layout */
    .dishes-grid {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .dish-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      gap: 14px;
      padding: 12px;
      transition: transform 0.2s var(--ease-out-expo), box-shadow 0.2s var(--ease-out-expo), border-color 0.2s;
      position: relative;
      cursor: pointer;
    }
    .dish-card:hover {
      border-color: var(--terracotta-border);
      box-shadow: var(--shadow-elevation);
    }

    /* ==========================================================================
       4 MAHARANI SIGNATURE DISHES IN DEEP ROYAL BLACK ONYX (#181514)
       ========================================================================== */
    .dish-card.maharani-signature-black {
      background: var(--charcoal-ink);
      border: 1px solid rgba(194, 155, 98, 0.5);
      box-shadow: 0 6px 20px rgba(24, 21, 20, 0.22);
      color: #FAF7F2;
    }
    .dish-card.maharani-signature-black:hover {
      border-color: var(--antique-brass);
      box-shadow: 0 10px 30px rgba(24, 21, 20, 0.35);
    }
    .dish-card.maharani-signature-black .dish-title {
      color: #FFFFFF;
      font-weight: 700;
    }
    .dish-card.maharani-signature-black .dish-desc {
      color: rgba(250, 247, 242, 0.74);
    }
    .dish-card.maharani-signature-black .dish-price {
      color: var(--antique-brass-light);
    }
    .dish-card.maharani-signature-black .signature-badge {
      background: rgba(194, 155, 98, 0.15);
      border: 1px solid var(--antique-brass);
      color: var(--antique-brass-light);
    }
    .dish-card.maharani-signature-black .btn-add-primary {
      background: var(--antique-brass);
      color: var(--charcoal-ink);
      font-weight: 800;
    }
    .dish-card.maharani-signature-black .btn-add-primary:hover {
      background: var(--antique-brass-light);
    }

    .dish-card-thumb-wrap {
      position: relative;
      width: 104px;
      height: 104px;
      flex-shrink: 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg-sandstone);
    }
    .dish-card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s var(--ease-out-expo);
    }
    .dish-card:hover .dish-card-thumb {
      transform: scale(1.06);
    }

    .dish-card-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .dish-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .signature-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #FFF7ED;
      border: 1px solid rgba(194, 155, 98, 0.4);
      border-radius: var(--radius-xs);
      padding: 1.5px 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #92400E;
    }

    .dish-title {
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: 0.02em;
      color: var(--charcoal-ink);
      line-height: 1.25;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .dish-desc {
      font-size: 12px;
      color: var(--charcoal-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .dish-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .dish-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--charcoal-ink);
      font-variant-numeric: tabular-nums;
    }

    /* Card Add Button / Stepper */
    .card-stepper-wrap {
      display: inline-flex;
      align-items: center;
    }

    .btn-add-primary {
      background: var(--terracotta);
      color: #FFFFFF;
      border: none;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s var(--ease-out-expo);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-add-primary:hover {
      background: var(--terracotta-dark);
      transform: translateY(-1px);
    }
    .btn-add-primary:active {
      transform: scale(0.96);
    }

    .card-active-stepper {
      display: none;
      align-items: center;
      gap: 6px;
      background: var(--charcoal-ink);
      border-radius: var(--radius-pill);
      padding: 3px 6px;
    }
    .card-active-stepper.active {
      display: inline-flex;
    }
    .stepper-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--charcoal-surface);
      color: #FFFFFF;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: background 0.15s;
    }
    .stepper-btn:hover {
      background: var(--terracotta);
    }
    .stepper-count {
      font-size: 12.5px;
      font-weight: 700;
      color: #FFFFFF;
      min-width: 16px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* Veg Indicator Dot */
    .fssai-veg-dot {
      width: 12px;
      height: 12px;
      border: 1.5px solid var(--veg-green);
      border-radius: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
    }
    .fssai-veg-dot::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--veg-green);
    }

    /* ==========================================================================
       FLOATING GUEST CART BAR (SLIDES UP ON ADD)
       ========================================================================== */
    .floating-cart-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      width: calc(100% - 32px);
      max-width: 500px;
      z-index: 90;
      background: var(--charcoal-ink);
      color: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-float);
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: transform 0.35s var(--ease-out-expo);
      cursor: pointer;
    }
    .floating-cart-bar.visible {
      transform: translateX(-50%) translateY(0);
    }

    .cart-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cart-badge-pill {
      background: var(--terracotta);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
    }
    .cart-bar-total {
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .cart-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--antique-brass-light);
    }
    .cart-bar-right svg {
      width: 16px;
      height: 16px;
    }

    /* ==========================================================================
       MODALS & SLIDE-UP BOTTOM SHEETS
       ========================================================================== */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 21, 20, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--ease-out-expo);
    }
    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(105%);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      background: var(--bg-canvas);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      z-index: 101;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.25);
      transition: transform 0.35s var(--ease-out-expo);
    }
    .bottom-sheet.open {
      transform: translateX(-50%) translateY(0);
    }

    .sheet-drag-handle-wrap {
      width: 100%;
      padding: 10px 0 6px 0;
      display: flex;
      justify-content: center;
      background: var(--bg-canvas);
      cursor: pointer;
    }
    .sheet-drag-handle {
      width: 38px;
      height: 4px;
      border-radius: var(--radius-pill);
      background: var(--border-medium);
    }

    /* Dish Detail Sheet Specifics */
    .dish-detail-scroll {
      overflow-y: auto;
      padding: 0 20px 24px 20px;
    }
    .detail-hero-media {
      width: 100%;
      height: 240px;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 16px;
      background: var(--bg-sandstone);

    // State
    const state = {
      activeCategory: MENU_DATA[0].id,
      diningMode: 'Dine In',
      table: 'Table 04',
      guestName: localStorage.getItem('maharani_guest_name') || '',
      guestPhone: localStorage.getItem('maharani_guest_phone') || '',
      searchQuery: '',

      currentModalDish: null,
      modalQty: 1
    };

    // Audio Feedback for High-End Tactile Feel (Leica/Braun style mechanical click)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playTactileClick() {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.035);
      } catch (e) {}
    }

    // Elements
    const catNavScroll = document.getElementById('catNavScroll');
    const menuMainContent = document.getElementById('menuMainContent');

    const searchClearBtn = document.getElementById('searchClearBtn');
    const emptySearchState = document.getElementById('emptySearchState');
    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const dishDetailSheet = document.getElementById('dishDetailSheet');
    const cartCheckoutSheet = document.getElementById('cartCheckoutSheet');
    const directorySheet = document.getElementById('directorySheet');
    const floatingCartBar = document.getElementById('floatingCartBar');
    const cartBarCount = document.getElementById('cartBarCount');
    const cartBarTotal = document.getElementById('cartBarTotal');

    // Initialize Menu Tabs (Integrated [☰ Index] + Pills)
    function renderCategoryTabs() {
      let html = `
        <button class="cat-nav-index-btn" id="openMenuIndexPill" aria-label="Open Category Index">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          <span>Categories</span>
        </button>
      `;

      MENU_DATA.forEach((cat, idx) => {
        const isActive = idx === 0 ? 'active' : '';
        html += `
          <button class="cat-nav-pill ${isActive}" data-cat-id="${cat.id}" id="tab-${cat.id}">
            ${cat.svg}
            <span>${cat.name}</span>
          </button>
        `;
      });
      catNavScroll.innerHTML = html;

      // Attach index pill click
      document.getElementById('openMenuIndexPill').addEventListener('click', () => {
        playTactileClick();
        openSheet(directorySheet);
      });

      catNavScroll.querySelectorAll('.cat-nav-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          playTactileClick();
          const targetId = btn.dataset.catId;
          const targetSection = document.getElementById('section-' + targetId);
          if (targetSection) {
            const topOffset = targetSection.getBoundingClientRect().top + window.pageYOffset - 105;
            window.scrollTo({ top: topOffset, behavior: 'smooth' });
          }
          setActiveTab(targetId);
        });
      });
    }

    function setActiveTab(catId) {
      state.activeCategory = catId;
      catNavScroll.querySelectorAll('.cat-nav-pill').forEach(btn => {
        const isMatch = btn.dataset.catId === catId;
        btn.classList.toggle('active', isMatch);
        if (isMatch) {
          btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      });
    }

    // Render Dishes (4 Signature dishes in luxurious Black Onyx)
    function renderDishes() {
      const query = state.searchQuery.trim().toLowerCase();
      let totalVisible = 0;
      let html = '';

      MENU_DATA.forEach(cat => {
        const filteredItems = cat.items.filter(item => {
          if (!query) return true;
          return item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
        });

        if (filteredItems.length === 0) return;
        totalVisible += filteredItems.length;

        html += `
          <section class="category-section" id="section-${cat.id}">
            <div class="cat-header-row">
              <h2 class="cat-header-title">
                ${cat.svg}
                <span>${cat.name}</span>
              </h2>
              <span class="cat-header-count">${filteredItems.length} ${filteredItems.length === 1 ? 'Dish' : 'Dishes'}</span>
            </div>
            <div class="dishes-grid">
        `;

        filteredItems.forEach(item => {
          const cartItem = state.cart[item.id];
          const qty = cartItem ? cartItem.qty : 0;
          const hasQty = qty > 0;
          const isBlackSignature = item.is_maharani;

          html += `
            <article class="dish-card ${isBlackSignature ? 'maharani-signature-black' : ''}" data-dish-id="${item.id}">
              <div class="dish-card-thumb-wrap">
                <img class="dish-card-thumb" src="${item.image}" alt="${item.clean_name}" loading="lazy" />
              </div>
              <div class="dish-card-info">
                <div>
                  <div class="dish-meta-row">
                    <span class="fssai-veg-dot"></span>
                    ${item.is_maharani ? '<span class="signature-badge">👑 Royal Signature</span>' : ''}
                  </div>
                  <h3 class="dish-title">${item.name}</h3>
                  <p class="dish-desc">${item.desc}</p>
                </div>
                <div class="dish-bottom-bar">
                  <span class="dish-price">₹${item.price}</span>
                  <div class="card-stepper-wrap" onclick="event.stopPropagation()">
                    <button class="btn-add-primary" data-action="add-first" data-dish-id="${item.id}" style="display: ${hasQty ? 'none' : 'inline-flex'};">
                      <span>+ ADD</span>
                    </button>
                    <div class="card-active-stepper ${hasQty ? 'active' : ''}" id="card-stepper-${item.id}">
                      <button class="stepper-btn" data-action="card-dec" data-dish-id="${item.id}">−</button>
                      <span class="stepper-count">${qty}</span>
                      <button class="stepper-btn" data-action="card-inc" data-dish-id="${item.id}">+</button>
                    </div>
                  </div>
                </div>
              </div>
            </article>
          `;
        });

        html += `
            </div>
          </section>
        `;
      });

      menuMainContent.innerHTML = html;
      emptySearchState.classList.toggle('visible', totalVisible === 0);

      // Attach card click handlers
      menuMainContent.querySelectorAll('.dish-card').forEach(card => {
        card.addEventListener('click', () => {
          const dishId = card.dataset.dishId;
          openDishDetail(dishId);
        });
      });

      // Attach button actions
      menuMainContent.querySelectorAll('[data-action="add-first"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          playTactileClick();
          const dishId = btn.dataset.dishId;
          const dish = findDishById(dishId);
          if (dish) addToCart(dish, 1, '');
        });
      });

      menuMainContent.querySelectorAll('[data-action="card-inc"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          playTactileClick();
          const dishId = btn.dataset.dishId;
          updateCartQty(dishId, 1);
        });
      });

      menuMainContent.querySelectorAll('[data-action="card-dec"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          playTactileClick();
          const dishId = btn.dataset.dishId;
          updateCartQty(dishId, -1);
        });
      });
    }

    function findDishById(id) {
      for (const cat of MENU_DATA) {
        for (const it of cat.items) {
          if (it.id === id) return it;
        }
      }
      return null;
    }

    // Cart Management
    function addToCart(dish, qty, specialNote) {
      if (!state.cart[dish.id]) {
        state.cart[dish.id] = { dish, qty: 0, specialNote: '' };
      }
      state.cart[dish.id].qty += qty;
      if (specialNote) {
        state.cart[dish.id].specialNote = specialNote;
      }
      updateCartUI();
    }

    function updateCartQty(dishId, delta) {
      if (!state.cart[dishId]) return;
      state.cart[dishId].qty += delta;
      if (state.cart[dishId].qty <= 0) {
        delete state.cart[dishId];
      }
      updateCartUI();
    }

    function updateCartUI() {
      let totalQty = 0;
      let subtotal = 0;

      for (const id in state.cart) {
        totalQty += state.cart[id].qty;
        subtotal += state.cart[id].qty * state.cart[id].dish.price;
      }

      // Update floating bar
      cartBarCount.textContent = totalQty;
      cartBarTotal.textContent = '₹' + subtotal;
      floatingCartBar.classList.toggle('visible', totalQty > 0);
      document.body.classList.toggle('has-cart', totalQty > 0);

      // Re-render dishes to update card steppers
      renderDishes();
      renderCartSheet();
    }

    // Dish Detail Bottom Sheet
    function openDishDetail(dishId) {
      playTactileClick();
      const dish = findDishById(dishId);
      if (!dish) return;

      state.currentModalDish = dish;
      state.modalQty = state.cart[dish.id] ? state.cart[dish.id].qty : 1;

      document.getElementById('detailImg').src = dish.image;
      document.getElementById('detailName').textContent = dish.name;
      document.getElementById('detailPrice').textContent = '₹' + dish.price;
      document.getElementById('detailDesc').textContent = dish.desc;
      document.getElementById('detailSpecialNote').value = state.cart[dish.id] ? state.cart[dish.id].specialNote : '';
      
      const metaRow = document.getElementById('detailMetaRow');
      metaRow.innerHTML = `
        <span class="fssai-veg-dot"></span>
        ${dish.is_maharani ? '<span class="signature-badge">👑 Royal Signature</span>' : ''}
      `;

      updateModalQtyUI();
      openSheet(dishDetailSheet);
    }

    function updateModalQtyUI() {
      document.getElementById('detailQty').textContent = state.modalQty;
      const total = state.modalQty * state.currentModalDish.price;
      document.getElementById('detailAddBtn').textContent = `Add to Order — ₹${total}`;
    }

    document.getElementById('detailIncBtn').addEventListener('click', () => {
      playTactileClick();
      state.modalQty++;
      updateModalQtyUI();
    });

    document.getElementById('detailDecBtn').addEventListener('click', () => {
      playTactileClick();
      if (state.modalQty > 1) {
        state.modalQty--;
        updateModalQtyUI();
      }
    });

    document.getElementById('detailAddBtn').addEventListener('click', () => {
      playTactileClick();
      const note = document.getElementById('detailSpecialNote').value.trim();
      if (!state.cart[state.currentModalDish.id]) {
        state.cart[state.currentModalDish.id] = { dish: state.currentModalDish, qty: 0, specialNote: '' };
      }
      state.cart[state.currentModalDish.id].qty = state.modalQty;
      state.cart[state.currentModalDish.id].specialNote = note;
      updateCartUI();
      closeSheets();
    });

    // Cart Sheet Rendering
    function renderCartSheet() {
      const cartItemsList = document.getElementById('cartItemsList');
      let html = '';
      let subtotal = 0;

      const items = Object.values(state.cart);
      if (items.length === 0) {
        cartItemsList.innerHTML = '<p style="text-align:center; padding: 20px; color: var(--charcoal-faint);">Your order cloche is currently empty.</p>';
        document.getElementById('billSubtotal').textContent = '₹0';
        document.getElementById('billGst').textContent = '₹0';
        document.getElementById('billGrandTotal').textContent = '₹0';
        return;
      }

      items.forEach(item => {
        const itemTotal = item.qty * item.dish.price;
        subtotal += itemTotal;
        html += `
          <div class="cart-item-row">
            <div style="flex:1;">
              <h4 class="cart-item-title">${item.dish.name}</h4>
              ${item.specialNote ? `<div class="cart-item-instruction">“${item.specialNote}”</div>` : ''}
              <div class="cart-item-pricing">₹${item.dish.price} × ${item.qty} = ₹${itemTotal}</div>
            </div>
            <div class="cart-row-stepper">
              <button class="stepper-btn" onclick="updateCartQty('${item.dish.id}', -1)">−</button>
              <span class="stepper-count">${item.qty}</span>
              <button class="stepper-btn" onclick="updateCartQty('${item.dish.id}', 1)">+</button>
            </div>
          </div>
        `;
      });

      cartItemsList.innerHTML = html;

      const gst = Math.round(subtotal * 0.05 * 100) / 100;
      const grandTotal = Math.round((subtotal + gst) * 100) / 100;

      document.getElementById('billSubtotal').textContent = '₹' + subtotal;
      document.getElementById('billGst').textContent = '₹' + gst.toFixed(2);
      document.getElementById('billGrandTotal').textContent = '₹' + grandTotal.toFixed(2);
    }

    // Menu Directory (Index Drawer)
    function renderDirectory() {
      const directoryList = document.getElementById('directoryList');
      let html = '';
      MENU_DATA.forEach(cat => {
        html += `
          <a class="directory-item" href="#section-${cat.id}" data-cat-id="${cat.id}">
            <span>${cat.name}</span>
            <span>${cat.items.length} dishes →</span>
          </a>
        `;
      });
      directoryList.innerHTML = html;

      directoryList.querySelectorAll('.directory-item').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          playTactileClick();
          closeSheets();
          const targetId = link.dataset.catId;
          const targetSection = document.getElementById('section-' + targetId);
          if (targetSection) {
            const topOffset = targetSection.getBoundingClientRect().top + window.pageYOffset - 105;
            window.scrollTo({ top: topOffset, behavior: 'smooth' });
          }
          setActiveTab(targetId);
        });
      });
    }

    // Sheet Controllers
    function openSheet(sheetEl) {
      sheetBackdrop.classList.add('open');
      sheetEl.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeSheets() {
      sheetBackdrop.classList.remove('open');
      document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open'));
      document.body.style.overflow = '';
    }

    sheetBackdrop.addEventListener('click', closeSheets);
    document.getElementById('cartCloseBtn').addEventListener('click', closeSheets);
    document.getElementById('directoryCloseBtn').addEventListener('click', closeSheets);
    floatingCartBar.addEventListener('click', () => {
      playTactileClick();
      openSheet(cartCheckoutSheet);
    });

    // Dining Mode Selector
    document.querySelectorAll('.dining-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        playTactileClick();
        document.querySelectorAll('.dining-toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.diningMode = btn.dataset.mode;
        document.getElementById('tableChipsSection').style.display = state.diningMode === 'Dine In' ? 'block' : 'none';
      });
    });

    // Table Chips Selector
    document.querySelectorAll('.table-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        playTactileClick();
        document.querySelectorAll('.table-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        state.table = chip.dataset.table;
      });
    });

    // Search Toggle
    searchToggleBtn.addEventListener('click', () => {
      playTactileClick();
      const isActive = searchPanel.classList.toggle('active');
      if (isActive) {
        menuSearchInput.focus();
      } else {
        menuSearchInput.value = '';
        state.searchQuery = '';
        searchClearBtn.style.display = 'none';
        renderDishes();
      }
    });

    menuSearchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      searchClearBtn.style.display = state.searchQuery ? 'block' : 'none';
      renderDishes();
    });

    searchClearBtn.addEventListener('click', () => {
      menuSearchInput.value = '';
      state.searchQuery = '';
      searchClearBtn.style.display = 'none';
      renderDishes();
      menuSearchInput.focus();
    });

    // ScrollSpy for Categories
    window.addEventListener('scroll', () => {
      const scrollPos = window.pageYOffset + 130;
      for (const cat of MENU_DATA) {
        const sec = document.getElementById('section-' + cat.id);
        if (sec) {
          const top = sec.offsetTop;
          const height = sec.offsetHeight;
          if (scrollPos >= top && scrollPos < top + height) {
            if (state.activeCategory !== cat.id) {
              setActiveTab(cat.id);
            }
            break;
          }
        }
      }
    }, { passive: true });

    // Save Guest Info
    document.getElementById('guestNameInput').addEventListener('input', (e) => {
      state.guestName = e.target.value;
      localStorage.setItem('maharani_guest_name', state.guestName);
    });
    document.getElementById('guestPhoneInput').addEventListener('input', (e) => {
      state.guestPhone = e.target.value;
      localStorage.setItem('maharani_guest_phone', state.guestPhone);
    });

    // Pre-populate guest info
    if (state.guestName) document.getElementById('guestNameInput').value = state.guestName;
    if (state.guestPhone) document.getElementById('guestPhoneInput').value = state.guestPhone;

    // THE SINGLE ORDER PLACEMENT ACTION — WHATSAPP FORMATTED RECEIPT
    document.getElementById('btnPlaceOrderWhatsApp').addEventListener('click', () => {
      playTactileClick();
      const items = Object.values(state.cart);
      if (items.length === 0) {
        alert('Please select at least one dish to place an order.');
        return;
      }

      let subtotal = 0;
      let orderLines = [];

      items.forEach(it => {
        const lineTotal = it.qty * it.dish.price;
        subtotal += lineTotal;
        let line = `• ${it.qty}x ${it.dish.name} — ₹${lineTotal}`;
        if (it.specialNote) {
          line += `\n  _(Note: ${it.specialNote})_`;
        }
        orderLines.push(line);
      });

      const gst = Math.round(subtotal * 0.05 * 100) / 100;
      const grandTotal = Math.round((subtotal + gst) * 100) / 100;

      const dateStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const diningLoc = state.diningMode === 'Dine In' ? `${state.table} (Dine In)` : 'Takeaway / Parcel';
      const guestTag = state.guestName ? state.guestName : 'Guest';

      const message = 
`👑 *MAHARANI CAFE — JAIPUR*
*GUEST ORDER CONFIRMATION*
━━━━━━━━━━━━━━━━━━━━
📍 *Service:* ${diningLoc}
👤 *Guest:* ${guestTag}
⏰ *Time:* ${dateStr}
━━━━━━━━━━━━━━━━━━━━
*ORDERED ITEMS:*
${orderLines.join('\n')}
━━━━━━━━━━━━━━━━━━━━
• Subtotal: ₹${subtotal}
• GST (5%): ₹${gst.toFixed(2)}
*GRAND TOTAL: ₹${grandTotal.toFixed(2)}*
━━━━━━━━━━━━━━━━━━━━
_Pure Vegetarian Artisanal Kitchen_
_Sent via Maharani Cafe QR Portal_`;

      const cafeWhatsApp = "919876543210"; // Official cafe ordering line
      const waUrl = `https://wa.me/${cafeWhatsApp}?text=${encodeURIComponent(message)}`;
      window.open(waUrl, '_blank');
    });

    // Initialize App
    document.addEventListener('DOMContentLoaded', () => {
      renderCategoryTabs();
      renderDishes();
      renderDirectory();
    });
  </script>
</body>
</html>
